<!doctype html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Trippolama | Adventure Travel & Unique Experiences</title>

    <meta
      name="description"
      content="Trippolama helps you discover adventure trips, camping stays, bike rides, guides, and unique travel experiences across India."
    />

    <meta
      name="keywords"
      content="travel india, camping stays, adventure travel, bike trips, travel experiences"
    />
    <meta name="robots" content="index,follow" />
    <meta property="og:title" content="Trippolama | Adventure Travel & Unique Experiences" />
    <meta
      property="og:description"
      content="Trippolama helps you discover adventure trips, camping stays, bike rides, guides, and unique travel experiences across India."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trippolama.com/" />
    <meta property="og:image" content="https://trippolama.com/founder-photo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trippolama | Adventure Travel & Unique Experiences" />
    <meta
      name="twitter:description"
      content="Trippolama helps you discover adventure trips, camping stays, bike rides, guides, and unique travel experiences across India."
    />
    <meta name="twitter:image" content="https://trippolama.com/founder-photo.jpg" />
    <link rel="canonical" href="https://trippolama.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Trippolama",
            "url": "https://trippolama.com",
            "logo": "https://trippolama.com/favicon.png"
          },
          {
            "@type": "WebSite",
            "name": "Trippolama",
            "url": "https://trippolama.com",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://trippolama.com/search?keyword={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
